org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.enableJetifier=true

# Termux fix: disables Gradle's native integration layer (the
# net.rubygrapefruit:native-platform library used for file-system
# watching / native OS-identification probes). This is the component
# that tries to read /usr/lib/os-release for host-OS detection and
# fails with PathNotFoundException on Termux, since Termux's Android
# filesystem has no standard /usr/lib hierarchy and no root access to
# create one. Setting this to false makes Gradle fall back to its pure
# JVM (non-native) code paths for these features -- it costs a small
# amount of build-cache/file-watching performance, but does not affect
# the compiled app in any way. This is a standard, documented Gradle
# property (not a Flutter or app-specific hack).
org.gradle.native=false

# Complementary safety net: disables Gradle's virtual file-system
# watching daemon, a SEPARATE native-code subsystem that can also
# perform its own OS/file-system probing independent of the above
# setting. Same rationale and same "no effect on the compiled app"
# guarantee as org.gradle.native=false above.
org.gradle.vfs.watch=false
